<header>
<a class="site-name" href="{{ "/" | relURL }}">Barbara Long</a>
  <button class="menu-toggle" aria-label="Toggle menu"
    onclick="this.classList.toggle('open'); document.querySelector('nav').classList.toggle('open')">
    <span></span><span></span><span></span>
  </button>
  <nav>
    {{ range .Site.Menus.main }}
      <a href="{{ .URL | relURL }}"{{ if eq $.RelPermalink (.URL | relURL) }} class="active"{{ end }}>{{ .Name }}</a>    {{ end }}
  </nav>
</header>
