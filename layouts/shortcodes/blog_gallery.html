{{ $gallery := .Page.Params.gallery }}
{{ if $gallery }}
  {{ $count := len $gallery }}
  <div class="gallery-grid count-{{ $count }}">
    {{ range $index, $item := $gallery }}
    <div class="gallery-item">
      <img src="{{ "images/" | relURL }}{{ $item.src }}" 
           alt="{{ $item.caption }}" 
           class="thumb" 
           data-index="{{ add $index 1 }}">
    </div>
    {{ end }}
  </div>

  <div id="lightbox" class="modal">
    <span class="close">&times;</span>
    <div class="modal-content">
      {{ range $index, $item := $gallery }}
      <div class="slide">
        <div class="numbertext">{{ add $index 1 }} / {{ $count }}</div>
        <img src="{{ "images/" | relURL }}{{ $item.src }}" alt="{{ $item.caption }}">
        <div class="caption-container">
          <p>{{ $item.caption }}</p>
        </div>
      </div>
      {{ end }}
      <a class="prev">&#10094;</a>
      <a class="next">&#10095;</a>
    </div>
  </div>

  <script>
    /* Use exactly the same script logic from your work pages here */
    (function() {
      const modal = document.getElementById("lightbox");
      const slides = document.getElementsByClassName("slide");
      let slideIndex = 1;
      document.querySelectorAll('.thumb').forEach(img => {
        img.onclick = () => {
          modal.style.display = "block";
          showSlide(slideIndex = parseInt(img.dataset.index));
        }
      });
      document.querySelector('.close').onclick = () => modal.style.display = "none";
      window.onclick = (e) => { if (e.target == modal) modal.style.display = "none"; }
      document.querySelector('.prev').onclick = () => showSlide(slideIndex -= 1);
      document.querySelector('.next').onclick = () => showSlide(slideIndex += 1);
      function showSlide(n) {
        if (n > slides.length) slideIndex = 1;
        if (n < 1) slideIndex = slides.length;
        for (let i = 0; i < slides.length; i++) slides[i].style.display = "none";
        slides[slideIndex - 1].style.display = "block";
      }
    })();
  </script>
{{ end }}
